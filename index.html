<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2027 업무 플래너</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f3a5f">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="업무 플래너">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: the PDF planner, typed — same paper, same tabs, same ruled lines
   COLOUR and TYPE: PDF theme tokens (navy · sand · dark), Poppins numerals, Noto Sans KR text
   LAYOUT: single navy tab bar like the PDF, month rail on the right on wide screens, ruled writing fields */
:root{color-scheme:light;
 --bar:#1f3a5f;--bar2:#1a3150;--head:#1f3a5f;--acc:#34828c;--acct:#2a6f78;--accbtn:#2f7c86;--onacc:#fff;
 --bg:#fcfcfa;--card:#fff;--soft:#f4f7f9;--tab:#e8ecf1;--line:#cacfd6;--boxb:#c8ced6;--gridb:#e2e6eb;
 --ink:#282c34;--mute:#5c626e;--label:#464e5c;--faint:#bec3ca;--side:#f0f2f5;--onbar:#fff;--onbar2:#becdde;
 --accsoft:#e6f2f3;--pill:#fff;--pilltxt:#1f3a5f;--sun:#cd4646;--sat:#3c6eb4;--amber:#a8690f;--teal:var(--acct)}
:root[data-skin=sand]{color-scheme:light;--bar:#6b5a48;--bar2:#5c4d3d;--head:#5f4e3c;--acc:#b88050;--acct:#8f5c2c;--accbtn:#a06a3a;--onacc:#fff;
 --bg:#faf6ef;--card:#fffdf9;--soft:#f5efe6;--tab:#eee6db;--line:#d6cbbd;--boxb:#d0c4b4;--gridb:#e6dccf;
 --ink:#3a322a;--mute:#766a5d;--label:#5f5448;--faint:#c8beb2;--side:#f3ece2;--onbar:#fffaf3;--onbar2:#e1d2c0;
 --accsoft:#f6e9db;--pill:#fffaf3;--pilltxt:#6b5a48;--sun:#c04a3a;--sat:#4a6a94;--amber:#9a5f0c}
:root[data-skin=dark]{color-scheme:dark;--bar:#13161c;--bar2:#0e1116;--head:#e8ebf0;--acc:#5fb3b8;--acct:#72c4c9;--accbtn:#5fb3b8;--onacc:#13161c;
 --bg:#1e2228;--card:#262b33;--soft:#2e343d;--tab:#323943;--line:#48505c;--boxb:#444c58;--gridb:#3a414c;
 --ink:#e2e6ec;--mute:#a0a8b4;--label:#b4bcc8;--faint:#606874;--side:#181c22;--onbar:#ebeef2;--onbar2:#96a0ae;
 --accsoft:#264246;--pill:#5fb3b8;--pilltxt:#13161c;--sun:#f07a70;--sat:#7aa6e8;--amber:#e0b04f}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip;word-break:keep-all;overflow-wrap:break-word}
.num{font-family:Poppins,"Noto Sans KR",sans-serif;font-variant-numeric:tabular-nums}
a{color:inherit}
/* ---- top bar (PDF frame) ---- */
header.tb{position:sticky;top:0;z-index:6;background:var(--bar);color:var(--onbar)}
.top{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 max(2vw,14px)}
.brand{font:600 14px/1 Poppins,sans-serif;letter-spacing:.05em;color:var(--onbar);text-decoration:none;white-space:nowrap}
.brand b{font-weight:300;color:var(--acc);margin-left:8px}
#nav{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;justify-content:center}
#nav::-webkit-scrollbar{display:none}
#nav a{flex:none;color:var(--onbar);text-decoration:none;font-size:15px;padding:7px 14px;border-radius:9px}
#nav a.on{background:var(--pill);color:var(--pilltxt);font-weight:700}
#nav a.bk{font-size:13px;color:var(--onbar2)}#nav a.bk.on{color:var(--pilltxt)}
.tools-r{display:flex;align-items:center;gap:8px;flex:none}
.save{font-size:12px;color:var(--onbar2);white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.tbtn{min-height:32px;padding:3px 11px;font-size:13px;font-weight:500;background:transparent;color:var(--onbar);border:1px solid color-mix(in srgb,var(--onbar) 35%,transparent);border-radius:8px}
@media(max-width:1180px){.top{flex-wrap:wrap;padding-top:10px}#nav{order:3;flex-basis:100%;justify-content:flex-start;padding-bottom:8px}.tools-r{margin-left:auto}}
@media(max-width:480px){.brand b{display:none}.save{max-width:96px;font-size:11px}.tbtn{padding:3px 8px}.top{gap:6px}.head .tools .sub{display:none}}
.skins{position:absolute;right:max(2vw,14px);top:52px;background:var(--card);color:var(--ink);border:1px solid var(--boxb);border-radius:12px;padding:12px;display:grid;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:8;width:230px}
.skins button{justify-content:flex-start;width:100%;background:var(--soft);color:var(--ink)}
.skins button.on{outline:2px solid var(--acc)}
.sw{width:22px;height:22px;border-radius:6px;flex:none;border:1px solid rgba(0,0,0,.15)}
/* month rail (PDF right tabs) */
.rail{position:fixed;right:0;top:56px;bottom:0;width:76px;background:var(--side);display:none;flex-direction:column;justify-content:space-evenly;padding:8px 7px;z-index:4}
.rail a{display:block;text-align:center;font:500 15px/1 Poppins,sans-serif;color:var(--mute);text-decoration:none;padding:9px 0;border-radius:8px}
.rail a.y{font-size:11.5px}
.rail a:hover{color:var(--acct)}
.rail a.on{background:var(--acc);color:var(--onacc);font-weight:600}
@media(min-width:1280px){.rail{display:flex}main{max-width:1316px;padding-right:calc(max(2.4vw,14px) + 76px)}}
a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
main{max-width:1240px;margin:0 auto;padding:22px max(2.4vw,14px) 64px}
/* ---- titles ---- */
h1{font-size:clamp(22px,2.6vw,28px);line-height:1.15;margin:0;text-wrap:balance;color:var(--ink)}
h2{font-size:15px;margin:0 0 10px}
.head{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;margin:2px 0 18px}
.head .sub{color:var(--mute);font-size:14px}
.head .tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.head .thumb{height:54px;width:auto}
.secno{font:300 32px/1 Poppins,sans-serif;color:var(--acc)}
.big{font:600 clamp(42px,5vw,56px)/1 Poppins,sans-serif;color:var(--acc)}
.st{font-size:15px;font-weight:700;color:var(--head);margin:28px 0 12px}
/* ---- boxes (PDF box()) ---- */
.card{background:var(--card);border:1px solid var(--boxb);border-radius:8px;padding:14px 16px}
.card h2{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--head)}
.card h2::before{content:"";width:4px;height:15px;border-radius:1px;background:var(--acc);flex:none}
.card h2 small{font:500 12.5px Poppins,"Noto Sans KR",sans-serif;color:var(--mute)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.spread{display:grid;gap:14px;grid-template-columns:minmax(0,2.1fr) minmax(0,1fr)}
@media(max-width:900px){.g3,.g4,.spread{grid-template-columns:minmax(0,1fr)}.g2{grid-template-columns:minmax(0,1fr)}}
.lbl{display:block;font-size:13px;font-weight:700;color:var(--label);margin:12px 0 2px}
.albl{color:var(--acct)!important}
/* ---- writing fields: ruled lines like the PDF ---- */
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:7px 2px;width:100%}
input:focus,select:focus{outline:none;border-bottom-color:var(--acc);box-shadow:0 1px 0 var(--acc)}
::placeholder{color:var(--mute);opacity:.6}
select{cursor:pointer}
select option{background:var(--card);color:var(--ink)}
textarea{display:block;resize:vertical;border:0;line-height:28px;padding:0 2px;min-height:84px;
 background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,var(--line) 27px,var(--line) 28px);background-attachment:local}
textarea:focus{outline:none;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,color-mix(in srgb,var(--acc) 60%,var(--line)) 27px,color-mix(in srgb,var(--acc) 60%,var(--line)) 28px)}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:1.5px solid var(--mute);border-radius:4px;padding:0;flex:none;margin:0;display:grid;place-content:center;background:var(--card);cursor:pointer}
input[type=checkbox]:checked{background:var(--acc);border-color:var(--acc)}
input[type=checkbox]:checked::after{content:"";width:5px;height:9px;border:solid var(--onacc);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
input[type=checkbox]:focus-visible{outline:3px solid var(--acc);outline-offset:2px;box-shadow:none}
input[type=range]{padding:0;border:0;accent-color:var(--acc);box-shadow:none}
/* ---- buttons ---- */
button,.btn{font:inherit;font-size:14px;font-weight:500;min-height:38px;padding:7px 14px;border-radius:8px;border:0;background:var(--tab);color:var(--head);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pri{background:var(--accbtn);color:var(--onacc);font-weight:700;border-radius:999px;padding:7px 20px}
.tl{background:transparent;color:var(--acct);font-weight:700;padding:7px 8px}
.ghost{background:transparent;color:var(--mute);min-height:32px;padding:4px 8px}
.danger{background:transparent;color:var(--sun)}
.row{display:flex;gap:8px;align-items:center}
.row>input{flex:1}
/* ---- lists ---- */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .t{flex:1}
.done .t{color:var(--mute);text-decoration:line-through}
.pill{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--tab);color:var(--label);white-space:nowrap;text-decoration:none}
.p-red{background:color-mix(in srgb,var(--sun) 15%,transparent);color:var(--sun)}
.p-amber{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.p-teal{background:var(--accsoft);color:var(--acct)}
.empty{color:var(--mute);font-size:14px;padding:8px 0;margin:0}
.bar{height:8px;border-radius:99px;background:var(--tab);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
a.link{color:var(--acct);font-weight:700;text-decoration:none}
.nob{display:inline-grid;place-items:center;min-width:38px;height:28px;border-radius:8px;background:var(--accsoft);color:var(--acct);font:600 13px Poppins,sans-serif}
/* ---- home cards (PDF home) ---- */
.hcards{display:grid;gap:16px;grid-template-columns:repeat(4,minmax(0,1fr))}
.hcard{position:relative;display:flex;flex-direction:column;justify-content:center;min-height:124px;padding:16px 20px;background:var(--card);border:1px solid var(--boxb);border-radius:12px;text-decoration:none;color:var(--ink);overflow:hidden;transition:border-color .15s,transform .15s}
.hcard:hover{border-color:var(--acc);transform:translateY(-2px)}
.hcard .no{font:300 26px/1 Poppins,sans-serif;color:var(--acc)}
.hcard b{font-size:17px;margin-top:8px}
.hcard small{color:var(--mute);font-size:12.5px;max-width:56%;line-height:1.4}
.hcard img{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:44%;max-width:124px;height:auto;pointer-events:none}
@media(max-width:900px){.hcards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.hcard{min-height:104px;padding:14px}}

.mstrip{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:8px}
.mstrip a{display:grid;place-items:center;height:54px;border-radius:10px;background:var(--tab);color:var(--head);font:600 16px Poppins,sans-serif;text-decoration:none}
.mstrip a.y{font-size:12px}
.mstrip a.on{background:var(--acc);color:var(--onacc)}
@media(max-width:900px){.mstrip{grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.mstrip a{height:42px;font-size:14px}}
.panel{background:var(--accsoft);border-radius:12px;padding:18px 20px;margin-top:22px}
.panel .ph{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.panel .ph b{color:var(--acct);font-size:15px}
.panel .card{border-color:transparent}
/* ---- section cover (PDF divider, ③) ---- */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:center;gap:10px;background:var(--bar);color:var(--onbar);border-radius:14px;padding:24px 34px;margin-bottom:20px;overflow:hidden;min-height:250px}
.hno{display:block;font:300 clamp(56px,7vw,92px)/.9 Poppins,sans-serif;color:var(--acc)}
.hl{display:block;width:44px;height:2px;background:var(--acc);margin:16px 0 12px}
.hero h1{font-size:clamp(26px,3vw,34px);color:var(--onbar)}
.hero .en{display:block;font-size:12.5px;letter-spacing:.08em;color:var(--onbar2);margin-top:6px}
.hero p{color:var(--onbar2);margin:8px 0 16px;font-size:14px}
.hi{display:flex;justify-content:flex-end}.hi img{width:100%;max-width:340px;height:auto;max-height:236px;object-fit:contain}
@media(max-width:640px){.hero{grid-template-columns:minmax(0,1fr) 112px;padding:18px 20px;min-height:0}.hl,.hero p{display:none}.hi img{max-height:104px}.hno{font-size:52px}}
/* ---- calendars ---- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{font-size:13px;font-weight:700;text-align:center;color:var(--head);background:var(--tab);padding:5px 0;border-radius:4px}
.cell{min-height:96px;background:var(--card);border:1px solid var(--gridb);border-radius:4px;padding:5px;font-size:12px;overflow:hidden}
.cell.out{background:var(--soft);border-color:transparent}
.cell.out .d{background:none;color:var(--faint);font-weight:500}
.cell.today,.mc.today{border:2px solid var(--acc)}
.cell .d,.dnum{display:inline-grid;place-items:center;min-width:30px;height:23px;padding:0 4px;border-radius:6px;background:var(--soft);font:600 13px Poppins,sans-serif;color:var(--ink);text-decoration:none}
.sat{color:var(--sat)!important}.sun,.hol{color:var(--sun)!important}
.cell .hn,.mc .hn{display:block;font-size:11.5px;color:var(--sun);margin-top:2px}
.chip{display:block;margin-top:3px;padding:1px 6px;border-radius:5px;background:var(--accsoft);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.chip.ok{text-decoration:line-through;color:var(--mute);background:var(--soft)}
.dot{display:none}
@media(max-width:600px){.cell,.mc{min-height:54px;padding:3px}.cell .chip,.mc .chip,.mc .note,.cell .hn,.mc .hn{display:none}.dot{display:block;width:6px;height:6px;border-radius:9px;background:var(--acc);margin:4px auto 0}.cell .d,.dnum{min-width:24px;font-size:12px}}
.mini{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:12.5px;margin-top:6px}
.mini a,.mini span{padding:4px 0;text-decoration:none;color:var(--ink);border-radius:6px}
.mini a:hover{background:var(--accsoft)}
.mini a.has{box-shadow:inset 0 -2px 0 var(--acc)}
.mini .h{font-weight:700;color:var(--mute);font-size:12px}
.ycal{display:grid;gap:16px;grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.ycal{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){.ycal{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
@media(max-width:400px){.ycal{grid-template-columns:minmax(0,1fr)}}
.ych{display:flex;align-items:baseline;gap:10px}
.ym{font:600 20px Poppins,sans-serif;color:var(--acc);text-decoration:none}
.yen{font:500 11.5px Poppins,sans-serif;letter-spacing:.06em;color:var(--mute);text-decoration:none}
/* month (③) */
.mtitle{display:flex;flex-direction:column}
.mtitle b{font-size:19px}.mtitle span{font-size:12px;letter-spacing:.06em;color:var(--mute)}
.mwrap{display:grid;gap:18px;grid-template-columns:minmax(0,2.25fr) minmax(0,1fr)}
@media(max-width:1060px){.mwrap{grid-template-columns:minmax(0,1fr)}}
.mgh,.mg{display:grid;grid-template-columns:46px repeat(7,minmax(0,1fr));gap:4px}
.mgh{background:var(--tab);border-radius:5px;margin-bottom:4px}
.mgh span{text-align:center;font-size:13px;font-weight:700;color:var(--head);padding:6px 0}
.wkc{display:grid;place-items:center;background:var(--soft);border-radius:5px;font-size:12.5px;font-weight:700;color:var(--acct);text-decoration:none;min-height:108px;text-align:center;line-height:1.2}
.mc{background:var(--card);border:1px solid var(--gridb);border-radius:4px;min-height:108px;padding:5px;font-size:12px;overflow:hidden}
.mc.out{background:var(--soft);border-color:transparent}
.mc.out .dnum{background:none;color:var(--faint);font-weight:500}
@media(max-width:600px){.mgh,.mg{grid-template-columns:30px repeat(7,minmax(0,1fr));gap:2px}.wkc{min-height:54px;font-size:11px}}
/* week */
.days{display:grid;gap:10px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:1000px){.days{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.days{grid-template-columns:minmax(0,1fr)}}
.day h3{margin:0 0 6px;font:600 18px Poppins,"Noto Sans KR",sans-serif;display:flex;gap:8px;align-items:baseline;color:var(--head)}
.day h3 small{font:500 13px "Noto Sans KR",sans-serif;color:var(--mute)}
.day textarea{min-height:56px}
.day.today,.dbox.today{border:2px solid var(--acc)}
.wwrap{display:grid;gap:16px;grid-template-columns:minmax(0,2.15fr) minmax(0,1fr)}
@media(max-width:1100px){.wwrap{grid-template-columns:minmax(0,1fr)}}
.dboxes{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:860px){.dboxes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.dboxes{grid-template-columns:minmax(0,1fr)}}
.dbox{padding:12px 14px}
.dbox .dh{display:flex;align-items:baseline;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--boxb);margin-bottom:4px}
.dn{font:600 19px Poppins,sans-serif;color:var(--head)}
.dbox .dh small{color:var(--mute);font-size:13px}
.dbox .dh .pill{margin-left:auto}
.dbox textarea{min-height:56px}
.band{background:var(--soft);border-radius:5px;padding:3px 9px;font-size:13px;font-weight:700;color:var(--head);margin:10px 0 2px}
.wend .half+.half{border-top:1px solid var(--boxb);margin-top:12px;padding-top:8px}
.top3 .num{color:var(--acc);font-weight:600;font-size:17px;width:18px}
.report{background:var(--card);border:1px solid var(--boxb);border-radius:8px;overflow:hidden}
.report>header{background:var(--bar);color:var(--onbar);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.report>header b{font-size:15px}.report>header span{font-size:12.5px;color:var(--onbar2)}
.report section{padding:12px 16px;border-bottom:1px solid var(--gridb)}
.report section:last-of-type{border-bottom:0}
.report h4{margin:0 0 6px;font-size:13.5px;color:var(--acct)}
.report ul{margin:0;padding-left:18px}
/* goals (③) */
.gbox .gt{font-size:16px;font-weight:700}
.kr{margin-top:16px}
.kr .albl{font:600 13px Poppins,sans-serif;width:34px;flex:none}
.prog{margin-top:4px}.prog .note{flex:none;width:40px}
.seg{flex:1;display:flex;gap:3px}
.seg button{flex:1;min-height:22px;height:22px;padding:0;background:transparent;border-radius:0;position:relative}
.seg button::before{content:"";position:absolute;inset:5px 0;border:1px solid var(--boxb);border-radius:2px}
.seg button.on::before{background:var(--acc);border-color:var(--acc)}
.pv{width:40px;text-align:right;font-size:13px;color:var(--acct);font-weight:600}
/* tables */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
thead th{background:var(--tab);color:var(--head);font-weight:700;font-size:13px;text-align:center;padding:8px;white-space:nowrap}
thead th:first-child{border-radius:6px 0 0 6px}thead th:last-child{border-radius:0 6px 6px 0}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}

 if(n<0)return`<span class="pill p-red">${-n}일 지연</span>`;if(n===0)return'<span class="pill p-amber">오늘</span>';
 return`<span class="pill ${n<=3?"p-amber":""}">D-${n}</span>`}

// ---------- storage ----------
// 구글 드라이브 동기화: 구글 클라우드에서 발급받은 "웹 애플리케이션" OAuth 클라이언트 ID를 넣으세요.
const CONFIG={GOOGLE_CLIENT_ID:"489021812240-dc0sbrel96brnpt86vu95lpo25vg6mpm.apps.googleusercontent.com"};
const inClaude=!!(window.claude&&window.claude.use);
let db=null,me=null,mode="local";const dirty=new Set(),busy=new Set();let flushT=null;
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};

 if(mode==="cloud"){setSave("저장 중…");clearTimeout(flushT);flushT=setTimeout(flush,900);return}
 dirty.clear();if(drive.on){setSave("기기에 저장됨 · 동기화 대기");clearTimeout(drive.timer);drive.timer=setTimeout(()=>syncNow(false),3000)}else setSave("이 기기에 저장됨")}
async function flush(){
 for(const k of [...dirty]){if(busy.has(k))continue;dirty.delete(k);busy.add(k);
  try{await db.collection("data/users/"+me).doc(k).set({v:S[k]})}

 if(dirty.size&&mode==="cloud"){flushT=setTimeout(flush,1500)}else setSave(mode==="cloud"?"계정에 저장됨 ✓":"이 기기에 저장됨")}

// ---------- google drive sync (buyer's own drive, hidden app folder) ----------
const drive={on:ls.get("wp_drive")==="1",token:null,exp:0,fileId:null,busy:false,again:false,client:null,timer:null,last:+(ls.get("wp_lastsync_at")||0)};
const DSCOPE="https://www.googleapis.com/auth/drive.appdata",DFILE="planner-data.json",GAPI="https://www.googleapis.com";

function loadGsi(){return new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return res();
 const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.async=true;s.onload=()=>res();s.onerror=()=>rej(new Error("gsi"));document.head.appendChild(s)})}
async function getToken(){if(drive.token&&Date.now()<drive.exp-60000)return drive.token;await loadGsi();
 return new Promise((res,rej)=>{if(!drive.client)drive.client=google.accounts.oauth2.initTokenClient({client_id:CONFIG.GOOGLE_CLIENT_ID,scope:DSCOPE,callback:()=>{}});
  drive.client.callback=r=>{if(r.error)return rej(new Error(r.error));drive.token=r.access_token;drive.exp=Date.now()+(+r.expires_in||3600)*1000;res(drive.token)};
  drive.client.error_callback=e=>rej(new Error(e&&e.type||"popup"));drive.client.requestAccessToken({prompt:""})})}
async function gfetch(url,opt={}){const t=await getToken();const r=await fetch(url,{...opt,headers:{Authorization:"Bearer "+t,...(opt.headers||{})}});
 if(r.status===401){drive.token=null;throw new Error("auth")}if(!r.ok)throw new Error("http "+r.status);return r}
async function findFile(){const q=encodeURIComponent(`name='${DFILE}'`);const r=await gfetch(`${GAPI}/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id)`);const j=await r.json();return j.files&&j.files[0]?j.files[0].id:null}

 if(drive.fileId){await gfetch(`${GAPI}/upload/drive/v3/files/${drive.fileId}?uploadType=media`,{method:"PATCH",headers:{"Content-Type":"application/json"},body});return}
 const bd="wp"+Date.now(),meta={name:DFILE,parents:["appDataFolder"]};

const hm=t=>{const d=new Date(t);return pad(d.getHours())+":"+pad(d.getMinutes())};
async function syncNow(fromClick){
 if(!syncReady())return;if(drive.busy){drive.again=true;return}
 if(!fromClick&&!(drive.token&&Date.now()<drive.exp-60000)){setSave("동기화하려면 ‘동기화’를 눌러 주세요");$("#syncbtn").hidden=false;return}
 drive.busy=true;setSave("동기화 중…");
 try{
  const remote=await readRemote(),base=+(ls.get("wp_base")||0),l=S.meta.updated||0,r=remote&&remote.meta?(remote.meta.updated||0):0;
  const lc=l>base,rc=remote&&r>base;
  if(!remote){await writeRemote(S)}
  else if(rc&&!lc){S={...blank(),...remote};localSave();rerender()}
  else if(lc&&!rc){await writeRemote(S)}
  else if(lc&&rc){if(r>l){ls.set("wp2027_conflict",JSON.stringify(S));S={...blank(),...remote};localSave();rerender()}else{ls.set("wp2027_conflict",JSON.stringify(remote));await writeRemote(S)}

  ls.set("wp_base",String(S.meta.updated||0));drive.on=true;ls.set("wp_drive","1");drive.last=Date.now();ls.set("wp_lastsync_at",String(drive.last));
  setSave("드라이브 동기화됨 · "+hm(drive.last));
 }catch(e){const m=String(e&&e.message||e);
  if(/popup|access_denied|auth/.test(m)){setSave("동기화하려면 ‘동기화’를 눌러 주세요")}else setSave("동기화 실패 · 기기에는 저장됨");
 }finally{drive.busy=false;$("#syncbtn").hidden=!syncReady();if(drive.again){drive.again=false;setTimeout(()=>syncNow(false),500)}}}
async function driveOff(){try{if(drive.token&&window.google)google.accounts.oauth2.revoke(drive.token,()=>{})}catch(e){}

  if(syncReady()&&drive.on){setSave("동기화하려면 ‘동기화’를 눌러 주세요")}else setSave("이 기기에 저장됨");
  return}

 const timer=setTimeout(()=>{if(mode!=="cloud")setSave("저장소 연결 대기 중 · 이 기기에 저장")},10000);
 try{
  const [d,u]=await Promise.all([c.use("db"),c.use("user")]);
  const id=u?await u.id():null;
  if(!d||!id){clearTimeout(timer);setSave("이 기기에 저장됨");return}
  db=d;me=id;const col=db.collection("data/users/"+me);
  const snaps=await Promise.all(KEYS.map(k=>col.doc(k).get()));
  let any=false;const loaded=blank();
  snaps.forEach((s,i)=>{if(s.exists){any=true;const v=s.data().v;if(v!==undefined)loaded[KEYS[i]]=JSON.parse(JSON.stringify(v))}});
  mode="cloud";clearTimeout(timer);
  if(any){S=loaded;localSave()}else if(S.tasks.length||S.projects.length||S.meetings.length||S.memos.length){KEYS.forEach(k=>dirty.add(k));flush()}
  setSave("계정에 저장됨 ✓");route();
 }catch(e){clearTimeout(timer);mode="local";setSave("이 기기에 저장됨")}
}

 if(el.type==="checkbox"||el.tagName==="SELECT"||"rr"in el.dataset)rerender()});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("[data-addtask]")&&!e.isComposing){e.preventDefault();addFrom(e.target)}});
function addFrom(inp){const v=inp.value.trim();if(!v)return;const d=inp.dataset;
 newTask({title:v,due:d.due||"",project:d.project||"",meeting:d.meeting||""});rerender();
 const sel=`[data-addtask]${d.due?`[data-due="${d.due}"]`:""}${d.meeting?`[data-meeting="${d.meeting}"]`:""}${d.project&&!d.meeting?`[data-project="${d.project}"]`:""}`;const n=document.querySelector(sel);if(n)n.focus()}

// ---------- actions ----------
function arm(btn){if(btn.dataset.armed)return true;btn.dataset.armed="1";const o=btn.textContent;btn.textContent="한 번 더 누르면 삭제";setTimeout(()=>{if(btn.isConnected){btn.textContent=o;delete btn.dataset.armed}},2500);return false}
const ROW={miles:()=>({t:"",d:"",done:false}),risks:()=>({r:"",a:""}),plan:()=>({d:"",t:"",w:""}),costs:()=>({item:"",amt:"",rc:false}),check:()=>({t:"",done:false})};
document.addEventListener("click",async e=>{
 if(!e.target.closest("#skins,#skinbtn")){const m=$("#skins");if(m&&!m.hidden){m.hidden=true;$("#skinbtn").setAttribute("aria-expanded","false")}}
 const tr=e.target.closest("tr[data-go]");if(tr&&!e.target.closest("a,button,input,select")){location.hash=tr.dataset.go;return}
 const b=e.target.closest("[data-act]");if(!b)return;const d=b.dataset,a=d.act;
 if(a==="tgl"){const t=byId("tasks",d.id);if(t){setStatus(t,b.checked?"done":"todo");rerender()}return}
 if(a==="tedit"){openTask=openTask===d.id?null:d.id;route.same=true;rerender();if(openTask){const f=document.getElementById("tp-"+d.id);if(f)f.focus()}return}
 if(a==="skinmenu"){const m=$("#skins");m.hidden=!m.hidden;b.setAttribute("aria-expanded",String(!m.hidden));return}
 if(a==="skin"){applySkin(d.v);ls.set("wp_skin",d.v);$("#skins").hidden=true;$("#skinbtn").setAttribute("aria-expanded","false");rerender();toast({navy:"네이비",sand:"샌드",dark:"다크"}[d.v]+" 테마로 바꿨어요");return}
 if(a==="sync"){syncNow(true);return}
 if(a==="driveoff"){if(!arm(b))return;driveOff();return}
 if(a==="restoreconflict"){const c=ls.get("wp2027_conflict");if(!c)return;if(!arm(b))return;try{S={...blank(),...JSON.parse(c)};KEYS.forEach(k=>save(k));toast("이전 내용으로 되돌렸어요");rerender()}catch(err){}return}
 if(a==="toreport"){const g=document.getElementById("report");if(g)g.scrollIntoView({behavior:"smooth"});return}
 if(a==="togoals"){const g=document.getElementById("goals");if(g)g.scrollIntoView({behavior:"smooth"});return}
 if(a==="addtask"){addFrom(b.previousElementSibling);return}
 if(a==="deltask"){S.tasks=S.tasks.filter(t=>t.id!==d.id);S.requests.forEach(r=>{if(r.task===d.id){r.task="";save("requests")}});save("tasks");rerender();return}
 if(a==="del"){if(!arm(b))return;S[d.c]=S[d.c].filter(x=>x.id!==d.id);
  if(d.c==="projects")S.tasks.forEach(t=>{if(t.project===d.id)t.project=""});if(d.c==="meetings")S.tasks.forEach(t=>{if(t.meeting===d.id)t.meeting=""});
  save(d.c);save("tasks");toast("삭제했어요");if(d.back)location.hash=d.back;else rerender();return}
 if(a==="addrow"){const it=byId(d.c,d.id);(it[d.f]=it[d.f]||[]).push(ROW[d.f]());save(d.c);rerender();return}
 if(a==="delrow"){const it=byId(d.c,d.id);it[d.f].splice(+d.i,1);save(d.c);rerender();return}
 if(a==="newproj"){const p={id:uid(),name:"새 프로젝트",client:"",start:today(),end:"",status:"plan",goal:"",log:"",miles:[],risks:[]};S.projects.push(p);save("projects");location.hash="project-"+p.id;return}
 if(a==="newmeet"){S.meta.mseq=(S.meta.mseq||0)+1;const m={id:uid(),no:S.meta.mseq,title:"",date:today(),time:"",people:"",place:"",project:"",agenda:"",notes:"",decisions:""};S.meetings.push(m);save("meetings");save("meta");location.hash="meeting-"+m.id;return}
 if(a==="newreq"){S.meta.rseq=(S.meta.rseq||0)+1;S.requests.push({id:uid(),no:S.meta.rseq,title:"",who:"",date:today(),due:"",status:"new",task:""});save("requests");save("meta");const nid=S.requests[S.requests.length-1].id;rerender();const f=document.querySelector(`[data-k="requests|${nid}|title"]`);if(f)f.focus();return}
 if(a==="req2task"){const r=byId("requests",d.id);const t=newTask({title:r.title||"업무 요청 처리",due:r.due,request:r.id,owner:""});r.task=t.id;if(r.status==="new")r.status="doing";save("requests");toast("할 일로 추가했어요");rerender();return}
 if(a==="newtrip"){const t={id:uid(),title:"",dest:"",start:"",end:"",purpose:"",with:"",plan:[],costs:[],check:CHECK.map(t=>({t,done:false})),summary:""};S.trips.push(t);save("trips");location.hash="trip-"+t.id;return}
 if(a==="newmemo"){const m={id:uid(),title:"",body:"",date:today()};S.memos.push(m);save("memos");memoSel=m.id;location.hash="memo-"+m.id;return}
 if(a==="copyrep"){const txt=reportText(P(d.ws));try{await navigator.clipboard.writeText(txt);toast("주간 보고를 복사했어요")}catch(err){const o=$("#repout");o.hidden=false;o.textContent=txt;toast("아래 내용을 길게 눌러 복사하세요")}return}
 if(a==="export"){const txt=JSON.stringify(S);const x=$("#exp");x.hidden=false;x.value=txt;try{await navigator.clipboard.writeText(txt);toast("복사했어요")}catch(err){x.select();toast("선택된 내용을 복사하세요")}return}
 if(a==="import"){try{const o=JSON.parse($("#imp").value);if(!o||!Array.isArray(o.tasks))throw 0;if(!arm(b))return;S={...blank(),...o};KEYS.forEach(k=>save(k));toast("복원했어요");location.hash="home"}catch(err){toast("올바른 백업 데이터가 아니에요")}return}
 if(a==="kr"){const k=S.goals.list[+d.g].krs[+d.r],v=+d.v;k.p=k.p===v?v-10:v;save("goals");rerender();return}
 if(a==="sample"){sample();return}
});

 newTask({title:"출장 신청서 제출",due:today()});
 S.meta.rseq=(S.meta.rseq||0)+1;S.requests.push({id:uid(),no:S.meta.rseq,title:"장비 사양서 송부",who:"김OO 과장 / 영업",date:s(-1),due:s(2),status:"doing",task:""});
 S.memos.push({id:uid(),title:"제안서 개선 아이디어",body:"- 비교표를 첫 장에\n- 설치 사례 사진 추가",date:today()});
 KEYS.forEach(k=>save(k));toast("예시 데이터를 넣었어요 (지워도 돼요)");rerender()}

boot();
}
