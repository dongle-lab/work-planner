<style>
/* VOICE: calm office tool, the PDF planner's navy-and-teal brand, typed instead of handwritten
   IDEA: a bound work planner — tabs on top, numbered sections, a weekly report that writes itself
   PICTURE: the working planner itself; the week spread and the auto report are the hero
   COLOUR and TYPE: navy bar, teal accent, warm paper; Poppins numerals, Noto Sans KR text
   LAYOUT: sticky tab bar, one view at a time, two-column spreads that stack under 860px */
:root{color-scheme:light dark;
 --bg:light-dark(#f7f7f3,#14181e);--paper:light-dark(#ffffff,#1d232b);--soft:light-dark(#eef2f5,#262d37);
 --line:light-dark(#d9dee5,#36404c);--ink:light-dark(#232831,#e4e8ee);--mute:light-dark(#5f6876,#9ea8b6);
 --navy:#1f3a5f;--bar:light-dark(#1f3a5f,#10141a);--teal:light-dark(#2f7c86,#5fb3b8);--tealsoft:light-dark(#e3f1f2,#22383c);
 --red:light-dark(#c8473f,#f07a70);--blue:light-dark(#3c6eb4,#7aa6e8);--amber:light-dark(#b7791f,#e0b04f);--onacc:#fff;--pill:#1f3a5f}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
/* skins chosen in the theme menu (override the viewer's light/dark) */
:root[data-skin=navy]{color-scheme:light;--bg:#f7f7f3;--paper:#fff;--soft:#eef2f5;--line:#d9dee5;--ink:#232831;--mute:#5f6876;--bar:#1f3a5f;--teal:#2f7c86;--tealsoft:#e3f1f2;--onacc:#fff;--pill:#1f3a5f}
:root[data-skin=sand]{color-scheme:light;--bg:#faf6ef;--paper:#fffdf9;--soft:#f3ece2;--line:#e2d7c8;--ink:#3a322a;--mute:#76695b;--bar:#6b5a48;--teal:#9c6634;--tealsoft:#f6e9db;--onacc:#fff;--pill:#6b5a48;--blue:#4a6a94}
:root[data-skin=dark]{color-scheme:dark;--bg:#14181e;--paper:#1d232b;--soft:#262d37;--line:#36404c;--ink:#e4e8ee;--mute:#9ea8b6;--bar:#0f1318;--teal:#5fb3b8;--tealsoft:#22383c;--onacc:#10141a;--pill:#10141a;--red:#f07a70;--blue:#7aa6e8;--amber:#e0b04f}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
.num{font-family:Poppins,"Noto Sans KR",sans-serif;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:var(--bar);color:#fff}
.top{display:flex;align-items:center;gap:14px;padding:10px max(3vw,14px)}
.brand{font:600 15px Poppins,sans-serif;letter-spacing:.02em;white-space:nowrap;color:#fff;text-decoration:none}
.brand b{color:#7fc7cc;font-weight:300;margin-left:6px}
.save{margin-left:auto;font-size:13px;color:#b9c7d8;white-space:nowrap}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 max(3vw,14px) 10px;scrollbar-width:none}
nav a{flex:none;color:#d8e2ee;text-decoration:none;font-size:15px;padding:8px 14px;border-radius:999px}
nav a.on{background:#fff;color:var(--pill);font-weight:700}
.tbtn{min-height:34px;padding:4px 12px;font-size:14px;background:transparent;color:#d8e2ee;border-color:rgba(255,255,255,.3)}
.skins{position:absolute;right:max(3vw,14px);top:52px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:8;width:230px}
.skins button{justify-content:flex-start;width:100%}
.sw{width:22px;height:22px;border-radius:6px;flex:none;border:1px solid rgba(0,0,0,.15)}
.skins button.on{border:2px solid var(--teal)}
nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
main{max-width:1240px;margin:0 auto;padding:22px max(3vw,14px) 60px}
h1{font-size:clamp(24px,3.4vw,34px);line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:18px;margin:0 0 10px}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head .sub{color:var(--mute);font-size:14px}
.head .tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.big{font:600 clamp(40px,6vw,60px)/1 Poppins,sans-serif;color:var(--teal)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.spread{display:grid;gap:14px;grid-template-columns:minmax(0,2.1fr) minmax(0,1fr)}
@media(max-width:860px){.g3,.g4,.spread{grid-template-columns:minmax(0,1fr)}.g2{grid-template-columns:minmax(0,1fr)}}
.lbl{display:block;font-size:13px;font-weight:700;color:var(--mute);margin:10px 0 4px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
textarea{resize:vertical;min-height:84px;line-height:1.6}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--teal);flex:none;margin:0}
input[type=range]{padding:0;accent-color:var(--teal)}
button,.btn{font:inherit;font-size:15px;min-height:40px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.pri{background:var(--teal);border-color:var(--teal);color:var(--onacc);font-weight:700}
.ghost{border-color:transparent;background:transparent;color:var(--mute)}
.danger{color:var(--red)}
.row{display:flex;gap:8px;align-items:center}
.row>input{flex:1}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .t{flex:1}
.done .t{color:var(--mute);text-decoration:line-through}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--mute);white-space:nowrap}
.p-red{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.p-amber{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.p-teal{background:var(--tealsoft);color:var(--teal)}
.empty{color:var(--mute);font-size:14px;padding:10px 0}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}
a.link{color:var(--teal);font-weight:700;text-decoration:none}
.secs{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.sec{display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:12px;background:var(--paper);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.sec .num{font-size:22px;font-weight:300;color:var(--teal)}.sec small{color:var(--mute)}
/* calendars */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{font-size:13px;font-weight:700;text-align:center;color:var(--mute);padding:4px 0}
.cell{min-height:96px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px;font-size:13px;overflow:hidden}
.cell.out{background:transparent;border-style:dashed;opacity:.5}
.cell.today{border:2px solid var(--teal)}
.cell .d{font:600 14px Poppins,sans-serif;color:var(--ink);text-decoration:none}
.sat{color:var(--blue)!important}.sun,.hol{color:var(--red)!important}
.cell .hn{display:block;font-size:12px;color:var(--red)}
.chip{display:block;margin-top:3px;padding:1px 6px;border-radius:5px;background:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.chip.ok{text-decoration:line-through;color:var(--mute)}
@media(max-width:600px){.cell{min-height:58px;padding:4px}.chip{display:none}.cell .dot{display:inline-block;width:6px;height:6px;border-radius:9px;background:var(--teal);margin-left:3px}}
.mini{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:13px}
.mini a,.mini span{padding:3px 0;text-decoration:none;color:var(--ink);border-radius:6px}
.mini a:hover{background:var(--tealsoft)}
.mini .h{font-weight:700;color:var(--mute);font-size:12px}
/* week */
.days{display:grid;gap:10px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:1000px){.days{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.days{grid-template-columns:minmax(0,1fr)}}
.day h3{margin:0 0 6px;font:600 18px Poppins,"Noto Sans KR",sans-serif;display:flex;gap:8px;align-items:baseline}
.day h3 small{font:500 13px "Noto Sans KR",sans-serif;color:var(--mute)}
.day textarea{min-height:58px}
.day.today{border:2px solid var(--teal)}
.report{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.report>header{position:static;background:var(--bar);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
.report>header b{font-size:16px}.report>header span{font-size:13px;color:#b9c7d8}
.report section{padding:12px 16px;border-bottom:1px solid var(--line)}
.report h4{margin:0 0 6px;font-size:14px;color:var(--teal)}
.report ul{margin:0;padding-left:18px}
/* tables */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:13px;color:var(--mute);text-align:start;padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td input,td select{padding:6px 8px}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.stack td.n{white-space:nowrap}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:6.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:6em;margin-inline-start:-6.5em;color:var(--mute);font-size:12px}.stack td:empty{display:none}}
.memo{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:14px}
@media(max-width:700px){.memo{grid-template-columns:minmax(0,1fr)}}
.mlist a{display:block;padding:10px;border-radius:8px;text-decoration:none;color:var(--ink)}
.mlist a.on{background:var(--tealsoft)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--bar);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
.note{font-size:13px;color:var(--mute)}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header>
 <div class="top"><a class="brand" href="#home">WORK PLANNER<b>2027</b></a><span class="save" id="save">불러오는 중…</span><button class="tbtn" id="syncbtn" data-act="sync" hidden>동기화</button><button class="tbtn" data-act="skinmenu" aria-haspopup="true" aria-expanded="false" id="skinbtn">테마</button></div>
 <div class="skins" id="skins" hidden><b style="font-size:14px">테마 선택</b>
  <button data-act="skin" data-v="navy"><span class="sw" style="background:linear-gradient(135deg,#1f3a5f 50%,#2f7c86 50%)"></span>네이비</button>
  <button data-act="skin" data-v="sand"><span class="sw" style="background:linear-gradient(135deg,#6b5a48 50%,#b8804f 50%)"></span>샌드</button>
  <button data-act="skin" data-v="dark"><span class="sw" style="background:linear-gradient(135deg,#14181e 50%,#5fb3b8 50%)"></span>다크</button></div>
 <nav id="nav">
  <a href="#home" data-s="home">홈</a><a href="#year" data-s="year">연간</a><a href="#month" data-s="month">월간</a><a href="#week" data-s="week">주간</a>
  <a href="#projects" data-s="projects">프로젝트</a><a href="#meetings" data-s="meetings">회의록</a><a href="#requests" data-s="requests">업무 요청</a>
  <a href="#trips" data-s="trips">출장</a><a href="#memos" data-s="memos">메모</a><a href="#backup" data-s="backup">저장 · 백업</a>
 </nav>
</header>
<main id="app"></main>
<div class="toast" id="toast" role="status"></div>
<script>
{
// ---------- constants ----------
const HOLI={"2026-12-25":"성탄절","2027-01-01":"신정","2027-02-06":"설 연휴","2027-02-07":"설날","2027-02-08":"설 연휴","2027-02-09":"대체공휴일","2027-03-01":"삼일절","2027-05-01":"노동절","2027-05-03":"대체공휴일","2027-05-05":"어린이날","2027-05-13":"부처님오신날","2027-06-06":"현충일","2027-07-17":"제헌절","2027-07-19":"대체공휴일","2027-08-15":"광복절","2027-08-16":"대체공휴일","2027-09-14":"추석 연휴","2027-09-15":"추석","2027-09-16":"추석 연휴","2027-10-03":"개천절","2027-10-04":"대체공휴일","2027-10-09":"한글날","2027-10-11":"대체공휴일","2027-12-25":"성탄절","2027-12-27":"대체공휴일"};
const DOW=["월","화","수","목","금","토","일"];
const ST={todo:"할 일",doing:"진행 중",done:"완료"};
const PST={plan:"계획",doing:"진행 중",hold:"보류",done:"완료"};
const RST={new:"접수",doing:"진행 중",done:"완료"};
const KEYS=["tasks","projects","meetings","requests","trips","memos","goals","weeks","months","meta"];
const CHECK=["노트북 · 충전기","명함","신분증","법인카드","출장 신청서 · 품의","견적서 · 제안 자료","작업복 · 안전화","숙소 예약 확인","교통편 예약 확인"];
const blank=()=>({tasks:[],projects:[],meetings:[],requests:[],trips:[],memos:[],goals:{list:[0,1,2].map(()=>({title:"",krs:[0,1,2].map(()=>({t:"",p:0}))})),q:["","","",""]},weeks:{},months:{},meta:{mseq:0,rseq:0}});
let S=blank();

// ---------- helpers ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const P=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>iso(new Date());
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return add(x,-((x.getDay()+6)%7))};
const wlabel=ws=>{const th=add(ws,3);return{y:th.getFullYear(),m:th.getMonth()+1,n:Math.floor((th.getDate()-1)/7)+1}};
const md=s=>s?(+s.slice(5,7))+"."+(+s.slice(8,10)):"";
const dleft=s=>Math.round((P(s)-P(today()))/864e5);
function dueBadge(due,done){if(done)return'<span class="pill p-teal">완료</span>';if(!due)return"";const n=dleft(due);
 if(n<0)return`<span class="pill p-red">${-n}일 지연</span>`;if(n===0)return'<span class="pill p-amber">오늘</span>';
 return`<span class="pill ${n<=3?"p-amber":""}">D-${n}</span>`}
const byId=(c,id)=>S[c].find(x=>x.id===id);
const opts=(map,v)=>Object.entries(map).map(([k,t])=>`<option value="${k}"${k===v?" selected":""}>${t}</option>`).join("");
const projOpts=v=>`<option value="">— 없음 —</option>`+S.projects.map(p=>`<option value="${p.id}"${p.id===v?" selected":""}>${esc(p.name||"이름 없는 프로젝트")}</option>`).join("");
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("on"),1800)}
function progress(pid){const ts=S.tasks.filter(t=>t.project===pid);const d=ts.filter(t=>t.status==="done").length;return{d,n:ts.length,p:ts.length?Math.round(d/ts.length*100):0}}

// ---------- storage ----------
// 구글 드라이브 동기화: 구글 클라우드에서 발급받은 "웹 애플리케이션" OAuth 클라이언트 ID를 넣으세요.
const CONFIG={GOOGLE_CLIENT_ID:"489021812240-dc0sbrel96brnpt86vu95lpo25vg6mpm.apps.googleusercontent.com"};
const inClaude=!!(window.claude&&window.claude.use);
let db=null,me=null,mode="local";const dirty=new Set(),busy=new Set();let flushT=null;
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
function setSave(t){$("#save").textContent=t}
function localLoad(){const r=ls.get("wp2027");if(r){try{S={...blank(),...JSON.parse(r)}}catch(e){}}}
function localSave(){ls.set("wp2027",JSON.stringify(S))}
function save(k){S.meta.updated=Date.now();dirty.add(k);dirty.add("meta");localSave();
 if(mode==="cloud"){setSave("저장 중…");clearTimeout(flushT);flushT=setTimeout(flush,900);return}
 dirty.clear();if(drive.on){setSave("기기에 저장됨 · 동기화 대기");clearTimeout(drive.timer);drive.timer=setTimeout(()=>syncNow(false),3000)}else setSave("이 기기에 저장됨")}
async function flush(){
 for(const k of [...dirty]){if(busy.has(k))continue;dirty.delete(k);busy.add(k);
  try{await db.collection("data/users/"+me).doc(k).set({v:S[k]})}
  catch(e){if(e&&(e.code==="invalid_argument"||e.code==="revoked"||e.code==="not_granted")){mode="local";dirty.clear();setSave("이 기기에 저장됨");toast("계정 저장소에 쓸 수 없어 이 기기에 저장합니다")}else dirty.add(k)}
  busy.delete(k)}
 if(dirty.size&&mode==="cloud"){flushT=setTimeout(flush,1500)}else setSave(mode==="cloud"?"계정에 저장됨 ✓":"이 기기에 저장됨")}

// ---------- google drive sync (buyer's own drive, hidden app folder) ----------
const drive={on:ls.get("wp_drive")==="1",token:null,exp:0,fileId:null,busy:false,again:false,client:null,timer:null,last:+(ls.get("wp_lastsync_at")||0)};
const DSCOPE="https://www.googleapis.com/auth/drive.appdata",DFILE="planner-data.json",GAPI="https://www.googleapis.com";
const syncReady=()=>!inClaude&&!!CONFIG.GOOGLE_CLIENT_ID;
function loadGsi(){return new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return res();
 const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.async=true;s.onload=()=>res();s.onerror=()=>rej(new Error("gsi"));document.head.appendChild(s)})}
async function getToken(){if(drive.token&&Date.now()<drive.exp-60000)return drive.token;await loadGsi();
 return new Promise((res,rej)=>{if(!drive.client)drive.client=google.accounts.oauth2.initTokenClient({client_id:CONFIG.GOOGLE_CLIENT_ID,scope:DSCOPE,callback:()=>{}});
  drive.client.callback=r=>{if(r.error)return rej(new Error(r.error));drive.token=r.access_token;drive.exp=Date.now()+(+r.expires_in||3600)*1000;res(drive.token)};
  drive.client.error_callback=e=>rej(new Error(e&&e.type||"popup"));drive.client.requestAccessToken({prompt:""})})}
async function gfetch(url,opt={}){const t=await getToken();const r=await fetch(url,{...opt,headers:{Authorization:"Bearer "+t,...(opt.headers||{})}});
 if(r.status===401){drive.token=null;throw new Error("auth")}if(!r.ok)throw new Error("http "+r.status);return r}
async function findFile(){const q=encodeURIComponent(`name='${DFILE}'`);const r=await gfetch(`${GAPI}/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id)`);const j=await r.json();return j.files&&j.files[0]?j.files[0].id:null}
async function readRemote(){if(!drive.fileId)drive.fileId=await findFile();if(!drive.fileId)return null;const r=await gfetch(`${GAPI}/drive/v3/files/${drive.fileId}?alt=media`);return r.json()}
async function writeRemote(obj){const body=JSON.stringify(obj);if(!drive.fileId)drive.fileId=await findFile();
 if(drive.fileId){await gfetch(`${GAPI}/upload/drive/v3/files/${drive.fileId}?uploadType=media`,{method:"PATCH",headers:{"Content-Type":"application/json"},body});return}
 const bd="wp"+Date.now(),meta={name:DFILE,parents:["appDataFolder"]};
 const mp=`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${bd}--`;
 const r=await gfetch(`${GAPI}/upload/drive/v3/files?uploadType=multipart&fields=id`,{method:"POST",headers:{"Content-Type":"multipart/related; boundary="+bd},body:mp});drive.fileId=(await r.json()).id}
const hm=t=>{const d=new Date(t);return pad(d.getHours())+":"+pad(d.getMinutes())};
async function syncNow(fromClick){
 if(!syncReady())return;if(drive.busy){drive.again=true;return}
 if(!fromClick&&!(drive.token&&Date.now()<drive.exp-60000)){setSave("동기화하려면 ‘동기화’를 눌러 주세요");$("#syncbtn").hidden=false;return}
 drive.busy=true;setSave("동기화 중…");
 try{
  const remote=await readRemote(),base=+(ls.get("wp_base")||0),l=S.meta.updated||0,r=remote&&remote.meta?(remote.meta.updated||0):0;
  const lc=l>base,rc=remote&&r>base;
  if(!remote){await writeRemote(S)}
  else if(rc&&!lc){S={...blank(),...remote};localSave();rerender()}
  else if(lc&&!rc){await writeRemote(S)}
  else if(lc&&rc){if(r>l){ls.set("wp2027_conflict",JSON.stringify(S));S={...blank(),...remote};localSave();rerender()}else{ls.set("wp2027_conflict",JSON.stringify(remote));await writeRemote(S)}
   toast("두 기기에서 동시에 고친 내용이 있어 최신 내용을 남겼어요 (이전 내용은 백업에 보관)")}
  ls.set("wp_base",String(S.meta.updated||0));drive.on=true;ls.set("wp_drive","1");drive.last=Date.now();ls.set("wp_lastsync_at",String(drive.last));
  setSave("드라이브 동기화됨 · "+hm(drive.last));
 }catch(e){const m=String(e&&e.message||e);
  if(/popup|access_denied|auth/.test(m)){setSave("동기화하려면 ‘동기화’를 눌러 주세요")}else setSave("동기화 실패 · 기기에는 저장됨");
 }finally{drive.busy=false;$("#syncbtn").hidden=!syncReady();if(drive.again){drive.again=false;setTimeout(()=>syncNow(false),500)}}}
async function driveOff(){try{if(drive.token&&window.google)google.accounts.oauth2.revoke(drive.token,()=>{})}catch(e){}
 drive.on=false;drive.token=null;drive.fileId=null;ls.del("wp_drive");ls.del("wp_base");setSave("이 기기에 저장됨");rerender()}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&drive.on&&drive.token&&Date.now()<drive.exp-60000)syncNow(false)});

// ---------- skins ----------
function applySkin(v){if(!["navy","sand","dark"].includes(v))v="navy";document.documentElement.dataset.skin=v;
 const tc=document.querySelector('meta[name="theme-color"]');if(tc)tc.content={navy:"#1f3a5f",sand:"#6b5a48",dark:"#0f1318"}[v];
 document.querySelectorAll('#skins [data-v]').forEach(b=>b.classList.toggle("on",b.dataset.v===v))}

async function boot(){
 applySkin(ls.get("wp_skin")||"navy");localLoad();route();
 if(!inClaude){
  if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  $("#syncbtn").hidden=!syncReady();if(syncReady())loadGsi().catch(()=>{});
  if(syncReady()&&drive.on){setSave("동기화하려면 ‘동기화’를 눌러 주세요")}else setSave("이 기기에 저장됨");
  return}
 const c=window.claude;
 const timer=setTimeout(()=>{if(mode!=="cloud")setSave("저장소 연결 대기 중 · 이 기기에 저장")},10000);
 try{
  const [d,u]=await Promise.all([c.use("db"),c.use("user")]);
  const id=u?await u.id():null;
  if(!d||!id){clearTimeout(timer);setSave("이 기기에 저장됨");return}
  db=d;me=id;const col=db.collection("data/users/"+me);
  const snaps=await Promise.all(KEYS.map(k=>col.doc(k).get()));
  let any=false;const loaded=blank();
  snaps.forEach((s,i)=>{if(s.exists){any=true;const v=s.data().v;if(v!==undefined)loaded[KEYS[i]]=JSON.parse(JSON.stringify(v))}});
  mode="cloud";clearTimeout(timer);
  if(any){S=loaded;localSave()}else if(S.tasks.length||S.projects.length||S.meetings.length||S.memos.length){KEYS.forEach(k=>dirty.add(k));flush()}
  setSave("계정에 저장됨 ✓");route();
 }catch(e){clearTimeout(timer);mode="local";setSave("이 기기에 저장됨")}
}

V.backup=()=>`<div class="head"><div><div class="sub">백업 · 동기화</div><h1>데이터 저장 · 동기화</h1></div></div>
 ${inClaude?"":`<div class="grid g2" style="margin-bottom:14px"><div class="card"><h2>구글 드라이브 동기화</h2>
  ${syncReady()?(drive.on?`<p>내 구글 드라이브의 앱 전용 숨김 폴더에 자동으로 저장하고, PC와 휴대폰을 맞춰요.</p><p class="note">마지막 동기화: ${drive.last?esc(new Date(drive.last).toLocaleString("ko-KR")):"아직 없음"}</p><div class="row" style="flex-wrap:wrap"><button class="pri" data-act="sync">지금 동기화</button><button class="danger" data-act="driveoff">동기화 끄기</button></div>`
  :`<p>구글 계정으로 연결하면 PC와 휴대폰에서 같은 내용을 볼 수 있어요. 데이터는 <b>내 구글 드라이브</b>에만 저장되고, 판매자를 포함해 누구도 볼 수 없어요.</p><button class="pri" data-act="sync">구글 드라이브 연결</button>`)
  :`<p class="note">동기화를 쓰려면 앱 설정에 구글 클라이언트 ID가 필요해요. 지금은 이 기기에만 저장돼요.</p>`}
  ${ls.get("wp2027_conflict")?`<p class="note" style="margin-top:12px">동시 수정으로 덮어쓴 이전 내용이 보관되어 있어요.</p><button data-act="restoreconflict">이전 내용으로 되돌리기</button>`:""}</div>
 <div class="card"><h2>앱처럼 설치하기</h2><p><b>아이폰 · 아이패드</b>: 사파리에서 공유 버튼 → <b>홈 화면에 추가</b>. 홈 화면에서 열어야 데이터가 안전하게 유지돼요.</p><p><b>안드로이드</b>: 크롬 메뉴 → <b>앱 설치</b> 또는 홈 화면에 추가.</p><p><b>PC</b>: 크롬 · 엣지 주소창 오른쪽의 <b>설치</b> 아이콘.</p></div></div>`}
 <div class="grid g2"><div class="card"><h2>내보내기</h2><p class="note">모든 데이터를 텍스트로 복사해 메모장 등에 보관하세요.</p><button class="pri" data-act="export">전체 데이터 복사</button><textarea id="exp" hidden style="margin-top:10px;min-height:160px" aria-label="내보낸 데이터"></textarea></div>
 <div class="card"><h2>가져오기</h2><p class="note">복사해 둔 데이터를 붙여 넣으면 현재 데이터를 덮어씁니다.</p><textarea id="imp" placeholder="여기에 붙여 넣기" aria-label="가져올 데이터"></textarea><button style="margin-top:8px" data-act="import">복원하기</button></div></div>
 <p class="note" style="margin-top:14px">저장 위치: ${mode==="cloud"?"내 계정의 개인 저장 공간 (다른 사람은 볼 수 없어요)":drive.on?"이 기기 + 내 구글 드라이브 (기기 간 동기화)":"이 기기의 브라우저 (다른 기기와 동기화되지 않아요)"}</p>`;

// ---------- router ----------
function route(){const h=(location.hash||"#home").slice(1);let [sec,...rest]=h.split("-");const arg=rest.join("-");
 const map={project:"projects",meeting:"meetings",trip:"trips",memo:"memos"};const navSec=map[sec]||sec;
 const fn=V[sec]||V.home;
 document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.s===(V[sec]?navSec:"home")));
 const y=scrollY;$("#app").innerHTML=fn(arg||undefined);if(route.same)scrollTo(0,y);route.same=false}
function rerender(){route.same=true;route()}
addEventListener("hashchange",()=>{route();scrollTo(0,0)});

// ---------- field binding ----------
function setPath(obj,path,val){const ps=path.split(".");let o=obj;for(let i=0;i<ps.length-1;i++){const k=ps[i];if(o[k]==null)o[k]=/^\d+$/.test(ps[i+1])?[]:{};o=o[k]}o[ps[ps.length-1]]=val}
function bind(el){const [c,a,b]=el.dataset.k.split("|");let v=el.type==="checkbox"?el.checked:el.value;if("num"in el.dataset)v=el.value===""?"":+el.value;
 if(b!==undefined){const it=byId(c,a);if(!it)return;setPath(it,b,v)}else if(c==="weeks"||c==="months"){const i=a.indexOf(".");const key=a.slice(0,i);S[c][key]=S[c][key]||{};setPath(S[c][key],a.slice(i+1),v)}else setPath(S[c],a,v);
 save(c);return true}
document.addEventListener("input",e=>{const el=e.target;
 if(el.id==="mq"){if(e.isComposing)return;memoSearch(el);return}
 if(!el.dataset.k)return;bind(el);
 if(el.type==="range"&&el.nextElementSibling)el.nextElementSibling.textContent=el.value+"%"});
function memoSearch(el){memoQ=el.value;const pos=el.selectionStart;rerender();const q=$("#mq");q.focus();q.setSelectionRange(pos,pos)}
document.addEventListener("compositionend",e=>{if(e.target.id==="mq")memoSearch(e.target)});
document.addEventListener("change",e=>{const el=e.target;if(!el.dataset.k)return;bind(el);
 if(el.type==="checkbox"||el.tagName==="SELECT"||"rr"in el.dataset)rerender()});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("[data-addtask]")&&!e.isComposing){e.preventDefault();addFrom(e.target)}});
function addFrom(inp){const v=inp.value.trim();if(!v)return;const d=inp.dataset;
 newTask({title:v,due:d.due||"",project:d.project||"",meeting:d.meeting||""});rerender();
 const sel=`[data-addtask]${d.due?`[data-due="${d.due}"]`:""}${d.meeting?`[data-meeting="${d.meeting}"]`:""}${d.project&&!d.meeting?`[data-project="${d.project}"]`:""}`;const n=document.querySelector(sel);if(n)n.focus()}

// ---------- actions ----------
function arm(btn){if(btn.dataset.armed)return true;btn.dataset.armed="1";const o=btn.textContent;btn.textContent="한 번 더 누르면 삭제";setTimeout(()=>{if(btn.isConnected){btn.textContent=o;delete btn.dataset.armed}},2500);return false}
const ROW={miles:()=>({t:"",d:"",done:false}),risks:()=>({r:"",a:""}),plan:()=>({d:"",t:"",w:""}),costs:()=>({item:"",amt:"",rc:false}),check:()=>({t:"",done:false})};
document.addEventListener("click",async e=>{
 if(!e.target.closest("#skins,#skinbtn")){const m=$("#skins");if(m&&!m.hidden){m.hidden=true;$("#skinbtn").setAttribute("aria-expanded","false")}}
 const tr=e.target.closest("tr[data-go]");if(tr&&!e.target.closest("a,button,input,select")){location.hash=tr.dataset.go;return}
 const b=e.target.closest("[data-act]");if(!b)return;const d=b.dataset,a=d.act;
 if(a==="tgl"){const t=byId("tasks",d.id);if(t){setStatus(t,b.checked?"done":"todo");if(t.request){const r=byId("requests",t.request);if(r&&b.checked){r.status="done";save("requests")}}rerender()}return}
 if(a==="skinmenu"){const m=$("#skins");m.hidden=!m.hidden;b.setAttribute("aria-expanded",String(!m.hidden));return}
 if(a==="skin"){applySkin(d.v);ls.set("wp_skin",d.v);$("#skins").hidden=true;$("#skinbtn").setAttribute("aria-expanded","false");toast({navy:"네이비",sand:"샌드",dark:"다크"}[d.v]+" 테마로 바꿨어요");return}
 if(a==="sync"){syncNow(true);return}
 if(a==="driveoff"){if(!arm(b))return;driveOff();return}
 if(a==="restoreconflict"){const c=ls.get("wp2027_conflict");if(!c)return;if(!arm(b))return;try{S={...blank(),...JSON.parse(c)};KEYS.forEach(k=>save(k));toast("이전 내용으로 되돌렸어요");rerender()}catch(err){}return}
 if(a==="toreport"){const g=document.getElementById("report");if(g)g.scrollIntoView({behavior:"smooth"});return}
 if(a==="togoals"){const g=document.getElementById("goals");if(g)g.scrollIntoView({behavior:"smooth"});return}
 if(a==="addtask"){addFrom(b.previousElementSibling);return}
 if(a==="deltask"){S.tasks=S.tasks.filter(t=>t.id!==d.id);S.requests.forEach(r=>{if(r.task===d.id){r.task="";save("requests")}});save("tasks");rerender();return}
 if(a==="del"){if(!arm(b))return;S[d.c]=S[d.c].filter(x=>x.id!==d.id);
  if(d.c==="projects")S.tasks.forEach(t=>{if(t.project===d.id)t.project=""});if(d.c==="meetings")S.tasks.forEach(t=>{if(t.meeting===d.id)t.meeting=""});
  save(d.c);save("tasks");toast("삭제했어요");if(d.back)location.hash=d.back;else rerender();return}
 if(a==="addrow"){const it=byId(d.c,d.id);(it[d.f]=it[d.f]||[]).push(ROW[d.f]());save(d.c);rerender();return}
 if(a==="delrow"){const it=byId(d.c,d.id);it[d.f].splice(+d.i,1);save(d.c);rerender();return}
 if(a==="newproj"){const p={id:uid(),name:"새 프로젝트",client:"",start:today(),end:"",status:"plan",goal:"",log:"",miles:[],risks:[]};S.projects.push(p);save("projects");location.hash="project-"+p.id;return}
 if(a==="newmeet"){S.meta.mseq=(S.meta.mseq||0)+1;const m={id:uid(),no:S.meta.mseq,title:"",date:today(),time:"",people:"",place:"",project:"",agenda:"",notes:"",decisions:""};S.meetings.push(m);save("meetings");save("meta");location.hash="meeting-"+m.id;return}
 if(a==="newreq"){S.meta.rseq=(S.meta.rseq||0)+1;S.requests.push({id:uid(),no:S.meta.rseq,title:"",who:"",date:today(),due:"",status:"new",task:""});save("requests");save("meta");const nid=S.requests[S.requests.length-1].id;rerender();const f=document.querySelector(`[data-k="requests|${nid}|title"]`);if(f)f.focus();return}
 if(a==="req2task"){const r=byId("requests",d.id);const t=newTask({title:r.title||"업무 요청 처리",due:r.due,request:r.id,owner:""});r.task=t.id;if(r.status==="new")r.status="doing";save("requests");toast("할 일로 추가했어요");rerender();return}
 if(a==="newtrip"){const t={id:uid(),title:"",dest:"",start:"",end:"",purpose:"",with:"",plan:[],costs:[],check:CHECK.map(t=>({t,done:false})),summary:""};S.trips.push(t);save("trips");location.hash="trip-"+t.id;return}
 if(a==="newmemo"){const m={id:uid(),title:"",body:"",date:today()};S.memos.push(m);save("memos");memoSel=m.id;location.hash="memo-"+m.id;return}
 if(a==="copyrep"){const txt=reportText(P(d.ws));try{await navigator.clipboard.writeText(txt);toast("주간 보고를 복사했어요")}catch(err){const o=$("#repout");o.hidden=false;o.textContent=txt;toast("아래 내용을 길게 눌러 복사하세요")}return}
 if(a==="export"){const txt=JSON.stringify(S);const x=$("#exp");x.hidden=false;x.value=txt;try{await navigator.clipboard.writeText(txt);toast("복사했어요")}catch(err){x.select();toast("선택된 내용을 복사하세요")}return}
 if(a==="import"){try{const o=JSON.parse($("#imp").value);if(!o||!Array.isArray(o.tasks))throw 0;if(!arm(b))return;S={...blank(),...o};KEYS.forEach(k=>save(k));toast("복원했어요");location.hash="home"}catch(err){toast("올바른 백업 데이터가 아니에요")}return}
 if(a==="sample"){sample();return}
});

function sample(){const t=new Date(),s=n=>iso(add(t,n)),ws=monday(t);
 const p={id:uid(),name:"신규 거래처 제안",client:"OO산업",start:s(-4),end:s(28),status:"doing",goal:"제안서와 견적 제출 후 1차 미팅",log:"",miles:[{t:"제안서 초안",d:s(-1),done:true},{t:"견적 확정",d:s(4),done:false},{t:"고객사 미팅",d:s(13),done:false}],risks:[{r:"단가 확인 지연",a:"구매팀과 일정 사전 협의"}]};
 S.projects.push(p);S.meta.mseq=(S.meta.mseq||0)+1;
 const m={id:uid(),no:S.meta.mseq,title:"주간 정기 회의",date:iso(ws),time:"10:00",people:"팀장, 김OO, 이OO",place:"회의실",project:p.id,agenda:"1. 제안서 검토\n2. 견적 일정",notes:"제안서 초안 확인, 사양표 보완 필요",decisions:"견적은 다음 주 화요일까지 발송"};S.meetings.push(m);
 newTask({title:"제안서 초안 작성",project:p.id,due:s(-1),status:"done",doneAt:today()});
 newTask({title:"견적서 검토 및 발송",project:p.id,meeting:m.id,owner:"김OO",due:s(3),status:"doing"});
 newTask({title:"고객사 미팅 자료 준비",project:p.id,meeting:m.id,owner:"나",due:s(8)});
 newTask({title:"출장 신청서 제출",due:today()});
 S.meta.rseq=(S.meta.rseq||0)+1;S.requests.push({id:uid(),no:S.meta.rseq,title:"장비 사양서 송부",who:"김OO 과장 / 영업",date:s(-1),due:s(2),status:"doing",task:""});
 S.memos.push({id:uid(),title:"제안서 개선 아이디어",body:"- 비교표를 첫 장에\n- 설치 사례 사진 추가",date:today()});
 KEYS.forEach(k=>save(k));toast("예시 데이터를 넣었어요 (지워도 돼요)");rerender()}

boot();
}
</script>
</body>
